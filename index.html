<title>Calendário Sagrado</title>
<style>

*{box-sizing:border-box}
html,body{margin:0;height:100%;color-scheme:dark;-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--bg);color:var(--ink);font:14px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;border:1px solid #8c7a58;background:#fffaf0;color:var(--ink);border-radius:8px;padding:7px 12px;cursor:pointer}

button.primary{background:var(--accent);border-color:#8a3d1a;color:#fff;font-weight:600}
button.ghost{background:transparent}
button.small{padding:4px 9px;font-size:12px}
button.big{display:block;width:100%;padding:12px;margin:10px 0;font-size:16px}
.warn{color:#e2632f}

svg text.c{text-anchor:middle;dominant-baseline:central}
svg text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
svg .sn{fill:#1d1a14;opacity:.55}
svg [data-act]{cursor:pointer}
svg .segp:hover{filter:brightness(1.08)}
svg .clk{animation:blink 1s infinite;stroke:#fff;stroke-width:4}

.pls{display:flex;flex-direction:column;gap:5px}
.pl{border-left:5px solid;padding:5px 7px;background:#fffaf0;color:var(--ink);border-radius:6px}
.pl.cur{box-shadow:0 0 0 2px var(--accent)}

.rows{margin:8px 0}

.ws{display:flex;gap:3px;flex-wrap:wrap;justify-content:flex-end}
.hint{color:var(--muted);font-size:12px;margin:6px 0 0}
.tsheet{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tt{width:100%;border-collapse:collapse;font-size:12px;margin-top:4px}.tt td{border-top:1px solid var(--line);padding:2px 3px}.tt tr.st{background:#efe2bf}
.techs{width:100%;border-collapse:collapse;font-size:12px}.techs th,.techs td{border:1px solid var(--line);padding:4px;vertical-align:top;text-align:left}
.lv{margin-right:6px;white-space:nowrap;font-weight:400}
.log{font-size:12px}.log div{padding:2px 0;border-bottom:1px dotted var(--line)}
.res{width:100%;border-collapse:collapse}.res td,.res th{padding:5px;border-bottom:1px solid var(--line);text-align:center}.res td:first-child{text-align:left}.res tr.win{background:#f6e7a8}

.seg.on{background:var(--accent);color:#fff;border-color:#8a3d1a}
.help li{margin:4px 0}
.free{display:inline-block;margin-left:6px;background:#2e8b57;color:#fff;border-radius:4px;padding:0 6px;font-size:11px}

.fbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;flex-wrap:wrap;align-items:center;gap:6px;max-width:calc(100% - 24px);background:rgba(255,250,240,.95);color:var(--ink);border-radius:12px;padding:4px 8px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.fbtns{display:inline-flex;gap:6px;flex-wrap:wrap}.fbtns button{padding:3px 9px;font-size:12px}

#tip{position:fixed;z-index:50;max-width:min(320px,80vw);background:#13201a;color:#f3ead6;border:1px solid #56705e;border-radius:8px;padding:7px 10px;font-size:13px;line-height:1.35;box-shadow:0 4px 14px rgba(0,0,0,.35);pointer-events:none}

.hc{background:#fffaf0;border:3px solid var(--c);border-radius:8px;padding:0 0 6px;font-size:12px;overflow:hidden}
.hct{background:var(--c);color:#fff;font-size:11px;padding:2px 6px}
.hcn{font-weight:700;padding:4px 6px 0}.hcc{padding:2px 6px;font-size:15px;min-height:4px}.hce{padding:0 6px;color:#4a3f2c}

.hca{margin:5px 6px 0;padding:3px 6px;border-radius:5px;background:#f6e7a8;font-size:11.5px}
.choosecards{margin:8px 0}
.pnav{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}

.rotate-hint{display:none}
@media (max-height:500px){ #side{width:clamp(180px,24vw,240px);padding:5px;gap:5px;font-size:11px} .sh{font-size:11px} .turn p{font-size:11.5px} .pn .vp{font-size:13px} .tok{width:13px;height:13px} .sbtns button{padding:3px 6px;font-size:11px} .slog{display:none} .turn{padding:6px 8px} .pl{padding:4px 6px} .st{font-size:11px} .small{font-size:10.5px} .box{padding:10px 12px} .opt{padding:7px 10px} }
@media (orientation:portrait) and (max-width:700px){ #app.game{flex-direction:column} #side{width:100%;max-height:45vh} .rotate-hint{display:block;position:fixed;top:0;left:0;right:0;background:#b5562b;color:#fff;text-align:center;padding:6px;z-index:5;font-size:13px} }
</style>
</head>

const DONE=()=>[];
const costTxt=c=>[...RES,'skull'].filter(r=>c[r]).map(r=>IC[r].repeat(c[r])).join('')||'grátis';
const blocks=p=>p.wood+p.stone+p.gold;
const canPay=(p,c)=>[...RES,'skull'].every(r=>(p[r]||0)>=(c[r]||0));
const pay=(p,c)=>[...RES,'skull'].forEach(r=>p[r]-=(c[r]||0));
function log(s,msg){ s.log.push(msg); if(s.log.length>120) s.log.shift(); }
function logp(s,pid,msg){ log(s,`${s.players[pid].name}: ${msg}`); }
const curPid=s=>(s.first+s.turnIdx)%s.n;
const occupied=(s,g,pos)=>s.workers.some(w=>w.gear===g&&w.pos===pos);
const ownOnGears=(s,pid)=>s.workers.filter(w=>w.owner===pid).length;
function availWorkers(s,pid){ return s.players[pid].workers-ownOnGears(s,pid)-(s.startWorker===pid?1:0); }
const canAnger=p=>p.temples.some(x=>x>0);
const topOf=t=>TEMPLES[t].vp.length-1;

function effText(e){
 const out=[];
 if(e.corn) out.push(`+${e.corn}🌽`);
 RES.forEach(r=>{ if(e[r]) out.push(`+${e[r]}${IC[r]}`); });
 if(e.skull) out.push(`+${e.skull}💀`);
 if(e.vp) out.push(`+${e.vp}★`);
 if(e.temples) e.temples.forEach((x,t)=>{ if(x) out.push(`${GOD[t]} +${x}`); });
 if(e.templeChoice) out.push(`+${e.templeChoice} templo à escolha`);
 if(e.tech!=null) out.push(`${TECHN[e.tech]} +1`);
 if(e.techChoice) out.push(e.techChoice===1?'+1 tecnologia à escolha':'2 níveis de tecnologia (numa ou em duas)');
 if(e.worker) out.push('+1 trabalhador');
 if(e.farm==='one') out.push('1 trabalhador come de graça');
 if(e.farm==='three') out.push('3 trabalhadores comem de graça');
 if(e.farm==='minus1') out.push('cada trabalhador come −1🌽');
 if(e.build) out.push('podes construir 1 edifício (como Tikal 2)');
 if(e.market) out.push('usar o mercado');
 if(e.action) out.push('pagar 1🌽 e fazer 1 ação noutra roda');
 return out.join(', ');
}
function actLabel(g,a){
 const gi=GI[g]; if(a===0) return 'sem ação'; if(a>gi.max) return '';
 if(a>=gi.free) return 'qualquer ação desta roda';
 if(g==='pal') return ['','Pescar 3🌽','4🌽 (milho)','5🌽 ou 2🪵','7🌽 ou 3🪵','9🌽 ou 4🪵'][a];
 if(g==='yax') return ['','1🪵','1🪨 +1🌽','1🪙 +2🌽','1💀','1🪙 1🪨 +2🌽'][a];
 if(g==='tik') return ['','1 tecnologia','1 edifício','1–2 tecnologias','1–2 edifícios ou 1 monumento','2 templos diferentes (paga 1 recurso)'][a];
 if(g==='uxm') return ['','3🌽 → 1 templo','Mercado','+1 trabalhador','Edifício pago em 🌽','1🌽 → ação noutra roda'][a];
 const c=CHI[a]; return `💀 → ${c.vp}★ + ${GOD[c.t]}${c.r?' + 1 recurso':''}`;
}

/* ---------- novo jogo ---------- */
function newGame(cfg){
 const n=cfg.players.length;
 const s={seed:(cfg.seed|0)||12345,n,day:0,round:1,first:0,turnIdx:0,players:[],workers:[],wid:1,startWorker:null,accCorn:0,
  pendingFood:null,endCount:0,age:1,skullBank:13,chi:Array(10).fill(null),jungle:{},deck1:[],deck2:[],slots:[],monuments:[],
  monBuilt:0,log:[],phase:'wealth',over:false,turn:null,hands:[],dummyTiles:[],result:null};
 for(let i=0;i<n;i++) s.players.push({id:i,name:cfg.players[i].name||CNAMES[i],bot:!!cfg.players[i].bot,color:COLORS[i],
  corn:0,wood:0,stone:0,gold:0,skull:0,vp:0,temples:[1,1,1],tech:[0,0,0,0],workers:3,light:true,buildings:[],monuments:[],
  farms:[],cornTiles:0,woodTiles:0,wealthChosen:null});
 const fp=n===4?4:n===3?3:2;
 for(let a=2;a<=5;a++){ s.jungle[a]=[]; for(let i=0;i<fp;i++) s.jungle[a].push({wood:a>=3,corn:true}); }
 BLD.forEach((b,i)=>(b.a===1?s.deck1:s.deck2).push(i)); shuffle(s,s.deck1); shuffle(s,s.deck2);
 for(let i=0;i<6;i++) s.slots.push(s.deck1.pop());
 s.monuments=shuffle(s,MON.map((m,i)=>i)).slice(0,{2:4,3:5,4:6}[n]);
 const tiles=shuffle(s,TILES.map((t,i)=>i));
 for(let i=0;i<n;i++) s.hands.push(tiles.splice(0,4));
 if(n<4){
  const lim=n===3?6:12; let placed=0; const firstOn={};
  while(placed<lim && tiles.length){
   const ti=tiles.shift(); const T=TILES[ti]; s.dummyTiles.push(ti);
   if(!occupied(s,T.g,T.a)){ s.workers.push({id:s.wid++,owner:-1,gear:T.g,pos:T.a}); placed++; }
   if(!firstOn[T.g]){ firstOn[T.g]=1;
    if(T.g!=='chi' && placed<lim){ const op=(T.a+5)%10; if(!occupied(s,T.g,op)){ s.workers.push({id:s.wid++,owner:-1,gear:T.g,pos:op}); placed++; } } }
  }
 }
 s.first=Math.floor(rnd(s)*n);
 log(s,`Novo jogo com ${n} jogadores. Começa ${s.players[s.first].name}.`);
 return s;
}
function chooseWealth(s,pid,arr){
 const p=s.players[pid]; p.wealthChosen=arr.slice();
 arr.forEach(ti=>runAuto(s,pid,effGen(pid,TILES[ti].e,DONE)));
 logp(s,pid,`riqueza inicial: ${arr.map(ti=>effText(TILES[ti].e)).join(' | ')}`);
 if(s.players.every(q=>q.wealthChosen)){ s.phase='play'; s.turnIdx=0; beginTurn(s); }
}
function runAuto(s,pid,gen){ let ns=gen(s); while(ns.length) ns=ns[0].run(s); }

/* ---------- templos ---------- */
function canUp(s,pid,t){ const p=s.players[pid]; const i=p.temples[t], top=topOf(t);
 if(i>=top) return false; if(i+1===top && s.players.some(q=>q.id!==pid && q.temples[t]===top)) return false; return true; }
function templeUp(s,pid,t){ if(!canUp(s,pid,t)) return false; const p=s.players[pid]; p.temples[t]++; if(p.temples[t]===topOf(t)) p.light=true; return true; }
function templeChoice(pid,n,k){ return s=>{ const out=[];
 for(let t=0;t<3;t++) if(canUp(s,pid,t)) out.push(N(`Subir no templo de ${GOD[t]}`, s=>{ templeUp(s,pid,t); return n>1?templeChoice(pid,n-1,k)(s):k(s); }));
 return out.length?out:k(s); }; }
function templeDown(pid,k){ return s=>{ const out=[]; const p=s.players[pid];
 for(let t=0;t<3;t++) if(p.temples[t]>0) out.push(N(`Descer no templo de ${GOD[t]}`, s=>{ s.players[pid].temples[t]--; return k(s); }));
 return out.length?out:k(s); }; }

/* ---------- recursos ---------- */
function payAny(pid,n,k){ return s=>{ const p=s.players[pid]; const out=[];
 for(let a=0;a<=n;a++) for(let b=0;b<=n-a;b++){ const c={wood:a,stone:b,gold:n-a-b}; if(canPay(p,c)) out.push(N(`Pagar ${costTxt(c)}`, s=>{ pay(s.players[pid],c); return k(s); })); }
 return out; }; }
function gain1(pid,k){ return s=>RES.map(r=>N(`Receber 1 ${RN[r]} ${IC[r]}`, s=>{ s.players[pid][r]++; return k(s); })); }
function gain2(pid,k){ return s=>{ const out=[]; for(let a=0;a<=2;a++) for(let b=0;b<=2-a;b++){ const c={wood:a,stone:b,gold:2-a-b};
 out.push(N(`Receber ${costTxt(c)}`, s=>{ const P=s.players[pid]; RES.forEach(r=>P[r]+=c[r]); return k(s); })); } return out; }; }
function market(pid,k){ const g=s=>{ const p=s.players[pid]; const out=[];
 RES.forEach(r=>{ if(p[r]>0) out.push(N(`Vender 1 ${RN[r]} → +${MK[r]}🌽`, s=>{ const P=s.players[pid]; P[r]--; P.corn+=MK[r]; return g(s); },{loop:1})); });
 RES.forEach(r=>{ if(p.corn>=MK[r]) out.push(N(`Comprar 1 ${RN[r]} por ${MK[r]}🌽`, s=>{ const P=s.players[pid]; P[r]++; P.corn-=MK[r]; return g(s); },{loop:1})); });
 out.push(N('Terminar trocas', k)); return out; }; return g; }

/* ---------- tecnologia ---------- */
function techBonus(pid,t,k){ return s=>{ const P=s.players[pid];
 if(t===0) return templeChoice(pid,1,k)(s);
 if(t===1) return gain2(pid,k)(s);
 if(t===2){ P.vp+=3; return k(s); }
 if(s.skullBank>0){ s.skullBank--; P.skull++; } return k(s); }; }
function techAdv(pid,t,paid,k){ return s=>{ const p=s.players[pid]; const c=p.tech[t]<3?p.tech[t]+1:1;
 const doIt=s=>{ const P=s.players[pid]; if(P.tech[t]<3){ P.tech[t]++; return k(s); } return techBonus(pid,t,k)(s); };
 return paid?payAny(pid,c,doIt)(s):doIt(s); }; }
function techChoice(pid,n,paid,k,canStop){ return s=>{ const p=s.players[pid]; const out=[];
 for(let t=0;t<4;t++){ const lv=p.tech[t]; const c=lv<3?lv+1:1; if(paid && blocks(p)<c) continue;
  const lab=lv<3?`${TECHN[t]} → nível ${lv+1}${paid?` (paga ${c} recurso${c>1?'s':''})`:''}`:`${TECHN[t]}: bónus ${TECHBON[t]}${paid?' (paga 1 recurso)':''}`;
  const after=n>1?techChoice(pid,n-1,paid,k,true):k;
  out.push(N(lab, s=>techAdv(pid,t,paid,after)(s))); }
 if(canStop){ if(!out.length) return k(s); out.push(N('Não avançar mais', k)); }
 return out; }; }

/* ---------- edifícios e monumentos ---------- */
function finishBuild(pid,i,applyArch,k){ return s=>{ const P=s.players[pid]; const bid=s.slots[i]; s.slots[i]=null; P.buildings.push(bid);
 if(applyArch){ if(P.tech[2]>=1) P.corn++; if(P.tech[2]>=2) P.vp+=2; }
 return effGen(pid,BLD[bid].e,k)(s); }; }
function build(pid,mode,k){ return s=>{ const p=s.players[pid]; const out=[]; const arch=p.tech[2]; const useArch=mode!=='tikNoArch';
 s.slots.forEach((bid,i)=>{ if(bid==null) return; const b=BLD[bid];
  if(mode==='uxm'){ const nb=RES.reduce((a,r)=>a+(b.c[r]||0),0); const cost=Math.max(0,2*nb-(arch>=3?2:0));
   if(p.corn>=cost) out.push(N(`Construir ${b.n} por ${cost}🌽`, s=>{ s.players[pid].corn-=cost; return finishBuild(pid,i,true,k)(s); },{bld:bid,paid:`${cost}🌽`,arch:archTxt(arch,true)}));
   return; }
  let vars=[b.c];
  if(useArch && arch>=3){ vars=RES.filter(r=>b.c[r]).map(r=>{ const c=Object.assign({},b.c); c[r]--; return c; }); }
  const seen={}; vars.forEach(c=>{ const key=costTxt(c); if(seen[key]) return; seen[key]=1;
   if(canPay(p,c)) out.push(N(`Construir ${b.n} (paga ${key})`, s=>{ pay(s.players[pid],c); return finishBuild(pid,i,useArch,k)(s); },{bld:bid,paid:key,arch:archTxt(arch,useArch),noArch:!useArch&&arch>0})); });
 });
 return out; }; }
function archTxt(a,use){ if(!use||a<1) return ''; return 'Arquitetura: +1🌽'+(a>=2?' +2★':''); }
function buildOpt(pid,k){ return s=>{ const ns=build(pid,'tik',k)(s); return ns.length?[...ns,N('Não construir',k)]:k(s); }; }
function tik4(pid,k){ return s=>{ const p=s.players[pid]; const arch=p.tech[2]; const out=[];
 const second=mode=>s=>{ const ns=build(pid,mode,k)(s); return ns.length?[...ns,N('Não construir um segundo edifício',k)]:k(s); };
 if(arch>0){
  build(pid,'tik',second('tikNoArch'))(s).forEach(n=>out.push(n));
 } else build(pid,'tik',second('tik'))(s).forEach(n=>out.push(n));
 s.monuments.forEach((mid,i)=>{ if(mid==null) return; const m=MON[mid];
  if(canPay(p,m.c)) out.push(N(`Construir monumento ${m.n} (paga ${costTxt(m.c)})`, s=>{ const P=s.players[pid]; pay(P,m.c); s.monuments[i]=null; P.monuments.push(mid); s.monBuilt++; return k(s); },{mon:mid,paid:costTxt(m.c)})); });
 return out; }; }

/* ---------- efeitos (edifícios / riqueza inicial) ---------- */
function effGen(pid,e,k){ return s=>{ const P=s.players[pid];
 if(e.corn) P.corn+=e.corn; RES.forEach(r=>{ if(e[r]) P[r]+=e[r]; });
 if(e.skull){ const g=Math.min(e.skull,s.skullBank); s.skullBank-=g; P.skull+=g; }
 if(e.vp) P.vp+=e.vp;
 if(e.worker && P.workers<6) P.workers++;
 if(e.farm) P.farms.push(e.farm);
 if(e.temples) e.temples.forEach((x,t)=>{ for(let i=0;i<x;i++) templeUp(s,pid,t); });
 let g=k;
 if(e.action) g=(kk=>s=>{ if(s.players[pid].corn<1) return kk(s); const ns=act(pid,'uxm',5,kk)(s); return ns.length?[...ns,N('Não usar',kk)]:kk(s); })(g);
 if(e.market) g=market(pid,g);
 if(e.build) g=buildOpt(pid,g);
 if(e.techChoice) g=techChoice(pid,e.techChoice,false,g,false);
 if(e.tech!=null) g=techAdv(pid,e.tech,false,g);
 if(e.templeChoice) g=templeChoice(pid,e.templeChoice,g);
 return g(s); }; }

/* ---------- ações das rodas ---------- */
function avail(s,pid,g,a){ return act(pid,g,a,DONE)(clone(s)).length>0; }
function freeChoice(pid,g,k){ return s=>{ const out=[]; const lim=g==='chi'?9:5;
 for(let a=1;a<=lim;a++) if(avail(s,pid,g,a)) out.push(N(`${GI[g].name} ${a}: ${actLabel(g,a)}`, s=>act(pid,g,a,k)(s)));
 return out; }; }
const agriBonus=p=>(p.tech[0]>=1?1:0)+(p.tech[0]>=3?2:0);
function act(pid,g,a,k){ return s=>{ const p=s.players[pid]; const gi=GI[g];
 if(a<=0) return [];
 if(a>=gi.free) return freeChoice(pid,g,k)(s);
 const simple=(lab,fn)=>[N(lab, s=>{ fn(s.players[pid],s); return k(s); })];
 if(g==='pal'){
  if(a===1){ const c=3+(p.tech[0]>=2?1:0); return simple(`Pescar: +${c}🌽`,P=>P.corn+=c); }
  const F=s.jungle[a]; const cAmt=PAL_CORN[a]+agriBonus(p); const wAmt=PAL_WOOD[a]+(p.tech[1]>=1?1:0);
  const wi=F.findIndex(f=>f.wood), ci=F.findIndex(f=>!f.wood&&f.corn); const out=[];
  if(wi>=0){
   out.push(N(`Recolher madeira: +${wAmt}🪵`, s=>{ const P=s.players[pid]; s.jungle[a][wi].wood=false; P.wood+=wAmt; P.woodTiles++; return k(s); }));
   if(canAnger(p)) out.push(N(`Queimar a floresta: +${cAmt}🌽 (zanga os deuses: desce 1 templo)`, s=>{ const P=s.players[pid]; const f=s.jungle[a][wi]; f.wood=false; f.corn=false; P.corn+=cAmt; P.cornTiles++; return templeDown(pid,k)(s); }));
  }
  if(ci>=0) out.push(N(`Colher milho: +${cAmt}🌽`, s=>{ const P=s.players[pid]; s.jungle[a][ci].corn=false; P.corn+=cAmt; P.cornTiles++; return k(s); }));
  else if(p.tech[0]>=2) out.push(N(`Colher milho sem peça: +${cAmt}🌽`, s=>{ s.players[pid].corn+=cAmt; return k(s); }));
  return out;
 }
 if(g==='yax'){ const R=p.tech[1];
  if(a===1){ const w=1+(R>=1?1:0); return simple(`+${w}🪵`,P=>P.wood+=w); }
  if(a===2){ const st=1+(R>=2?1:0); return simple(`+${st}🪨 +1🌽`,P=>{P.stone+=st;P.corn+=1;}); }
  if(a===3){ const go=1+(R>=3?1:0); return simple(`+${go}🪙 +2🌽`,P=>{P.gold+=go;P.corn+=2;}); }
  if(a===4){ if(s.skullBank<=0) return []; const n=Math.min(s.skullBank,1+(p.tech[3]>=3?1:0)); return simple(`+${n}💀`,(P,s)=>{ s.skullBank-=n; P.skull+=n; }); }
  const go=1+(R>=3?1:0), st=1+(R>=2?1:0); return simple(`+${go}🪙 +${st}🪨 +2🌽`,P=>{P.gold+=go;P.stone+=st;P.corn+=2;});
 }
 if(g==='tik'){
  if(a===1) return techChoice(pid,1,true,k,false)(s);
  if(a===2) return build(pid,'tik',k)(s);
  if(a===3) return techChoice(pid,2,true,k,false)(s);
  if(a===4) return tik4(pid,k)(s);
  if(blocks(p)<1) return [];
  return [[0,1],[0,2],[1,2]].map(([x,y])=>N(`Subir em ${GOD[x]} e ${GOD[y]} (paga 1 recurso)`, s=>payAny(pid,1,s=>{ templeUp(s,pid,x); templeUp(s,pid,y); return k(s); })(s)));
 }
 if(g==='uxm'){
  if(a===1){ if(p.corn<3) return []; return [N('Pagar 3🌽 e subir 1 templo', s=>{ s.players[pid].corn-=3; return templeChoice(pid,1,k)(s); })]; }
  if(a===2) return market(pid,k)(s);
  if(a===3){ if(p.workers>=6) return []; return simple('+1 trabalhador',P=>P.workers++); }
  if(a===4) return build(pid,'uxm',k)(s);
  if(p.corn<1) return []; const out=[];
  ['pal','yax','tik','uxm'].forEach(g2=>{ for(let b=1;b<=5;b++){ if(g2==='uxm'&&b===5) continue;
   const t=clone(s); t.players[pid].corn-=1; if(!act(pid,g2,b,DONE)(t).length) continue;
   out.push(N(`Pagar 1🌽 → ${GI[g2].name} ${b}: ${actLabel(g2,b)}`, s=>{ s.players[pid].corn-=1; return act(pid,g2,b,k)(s); })); } });
  return out;
 }
 // Chichén Itzá
 if(p.skull<1 || s.chi[a]!=null) return [];
 const c=CHI[a];
 return [N(`Colocar 💀: +${c.vp}★, ${GOD[c.t]} +1${c.r?', +1 recurso':''}`, s=>{ const P=s.players[pid]; P.skull--; s.chi[a]=pid; P.vp+=c.vp; templeUp(s,pid,c.t);
  const after=s=>{ const Q=s.players[pid]; if(Q.tech[3]>=2 && blocks(Q)>0) return [N('Teologia: gastar 1 recurso para subir 1 templo', s=>payAny(pid,1,templeChoice(pid,1,k))(s)), N('Não gastar', k)]; return k(s); };
  return c.r?gain1(pid,after)(s):after(s); })];
}; }

/* ---------- recolher trabalhador ---------- */
function removeW(s,wid){ s.workers=s.workers.filter(w=>w.id!==wid); }
function pickGen(pid,wid){ return s=>{ const w=s.workers.find(x=>x.id===wid); if(!w) return []; const p=s.players[pid];
 const g=w.gear, q=w.pos, gi=GI[g]; const cands=new Map();
 const add=(a,c)=>{ if(!cands.has(a)||cands.get(a)>c) cands.set(a,c); };
 if(g!=='chi'){ if(q>=gi.free){ for(let a=1;a<gi.free;a++) add(a,0); } else for(let a=1;a<=q;a++) add(a,q-a); }
 else { if(q>=10){ for(let a=1;a<=9;a++) add(a,0); } else { for(let a=1;a<=q;a++) add(a,q-a);
  if(p.tech[3]>=1){ if(q+1<=9) add(q+1,0); else for(let a=1;a<=9;a++) add(a,0); } } }
 const out=[];
 [...cands.entries()].sort((x,y)=>x[0]-y[0]).forEach(([a,c])=>{
  if(p.corn<c) return; const t=clone(s); removeW(t,wid); t.players[pid].corn-=c; if(!act(pid,g,a,DONE)(t).length) return;
  const lab=`${gi.name} ${a}: ${actLabel(g,a)}${c?` (paga ${c}🌽 para recuar)`:''}${g==='chi'&&a===q+1&&q<10?' (Teologia)':''}`;
  out.push(N(lab, s=>{ removeW(s,wid); s.players[pid].corn-=c; s.turn.picks++; return act(pid,g,a,DONE)(s); },{pa:a,pc:c,here:a===q&&c===0}));
 });
 out.push(N('Recolher sem fazer ação', s=>{ removeW(s,wid); s.turn.picks++; return []; },{none:1}));
 return out; }; }

/* ---------- turnos ---------- */
function beginTurn(s){ s.turn={pid:curPid(s),acted:false,mode:null,begged:false,placedStart:false,picks:0}; }
function nextFreePos(s,g,extra){ const occ=new Set(s.workers.filter(w=>w.gear===g).map(w=>w.pos)); (extra||[]).forEach(x=>occ.add(x));
 for(let q=0;q<=GI[g].max;q++) if(!occ.has(q)) return q; return -1; }
function planPlacement(s,pid,list){ const extra={}; let cost=0; const spots=[]; let st=false;
 for(const g of list){ if(g==='start'){ if(s.startWorker!==null||st) return {ok:false}; st=true; spots.push({gear:'start',pos:0}); continue; }
  const q=nextFreePos(s,g,extra[g]); if(q<0) return {ok:false}; (extra[g]=extra[g]||[]).push(q); cost+=q; spots.push({gear:g,pos:q}); }
 if(list.length>6) return {ok:false}; cost+=WCOST[list.length]; return {ok:true,cost,spots}; }
function minCost1(s,pid){ let m=99; GEARS.forEach(g=>{ const q=nextFreePos(s,g); if(q>=0) m=Math.min(m,q); }); if(s.startWorker===null) m=0; return m; }
function placeRaw(s,pid,list){ const pl=planPlacement(s,pid,list); if(!pl.ok) return false; const p=s.players[pid]; p.corn-=pl.cost;
 pl.spots.forEach(sp=>{ if(sp.gear==='start'){ s.startWorker=pid; if(s.turn) s.turn.placedStart=true; } else s.workers.push({id:s.wid++,owner:pid,gear:sp.gear,pos:sp.pos}); });
 return pl; }

function fdInfo(s){ let mids=0,ends=0; for(const d in FOOD){ if(+d>=s.day && +d>0){ if(FOOD[d]==='mid') mids++; else ends++; } }

 if(e.worker) o.push('+👤'); if(e.farm==='one') o.push('1👤 come grátis'); if(e.farm==='three') o.push('3👤 comem grátis'); if(e.farm==='minus1') o.push('👤 come −1🌽');
 if(e.build) o.push('+🏛'); if(e.market) o.push('⇄ mercado'); if(e.action) o.push('1🌽→ação'); return o; }

 if(t===0) return bg+`<path d="M0,-6.5 C2.6,-2.6 5,0 5,2.6 A5,5 0 0 1 -5,2.6 C-5,0 -2.6,-2.6 0,-6.5Z" fill="#fff"/><path d="M-2.2,2.4 A2.4,2.4 0 0 0 0.6,4.6" fill="none" stroke="${TCOL[t]}" stroke-width="1.2" stroke-linecap="round"/>`;

  return bg+r+`<circle r="3.3" fill="#fff"/>`; }
 return bg+`<path d="M-6.2,4.2 C-6.2,-1.6 -1.6,-1.6 -0.6,1.2 C0.4,4 4.4,4 4.4,-1.2" fill="none" stroke="#fff" stroke-width="2.1" stroke-linecap="round"/><circle cx="4.4" cy="-2.6" r="2.1" fill="#fff"/><circle cx="5" cy="-2.9" r=".55" fill="${TCOL[t]}"/>`; }

function techSVG1(t,x,y,r){ return `<g transform="translate(${x},${y}) scale(${(r/10).toFixed(3)})" pointer-events="none">${techPaths(t)}</g>`; }
function rich(s){ return esc(s).replace(/Chaac|Quetzalcóatl|Kukulcán/g,m=>godH(E.GOD.indexOf(m))).replace(/Agricultura|Extração|Arquitetura|Teologia/g,m=>techH(E.TECHN.indexOf(m))); }


const GODTIP=['Chaac (templo castanho, símbolo da chuva)','Quetzalcóatl (templo amarelo, símbolo do sol)','Kukulcán (templo verde, símbolo da serpente)'];
const TECHTIP=['Agricultura: mais milho em Palenque (selva e pesca)','Extração: mais recursos em Yaxchilan e madeira em Palenque','Arquitetura: bónus ao construir edifícios (Tikal e Uxmal)','Teologia: vantagens em Chichén Itzá e caveiras em Yaxchilan'];
function tipGear(g,k){ const gi=E.GI[g];
 if(k===0) return `${gi.name} 0: sem ação. Ao colocar, o trabalhador entra no espaço livre mais baixo; espera que a roda o faça avançar.`;
 if(k>gi.max) return `${gi.name} ${k}: fora do tabuleiro. Um trabalhador que passe da última posição volta para o dono sem ação.`;
 let t=`${gi.name} ${k}: ${E.actLabel(g,k).replace(/[🌽🪵🪨🪙💀★]/gu,m=>({'🌽':' milho','🪵':' madeira','🪨':' pedra','🪙':' ouro','💀':' caveira','★':' pontos'})[m])}.`;
 if(g==='chi'&&k<=9){ const c=E.CHI[k]; t=`Chichén Itzá ${k}: deixa 1 caveira para ganhar ${c.vp} pontos e subir 1 degrau no templo de ${E.GOD[c.t]}${c.r?' e receber 1 recurso à escolha':''}. Cada espaço só aceita uma caveira.${S.chi[k]!=null?` Já ocupado por ${S.players[S.chi[k]].name}.`:''}`; }
 if(k>=gi.free) t+=' Podes escolher qualquer ação desta roda sem pagar.';
 else t+=' Ao recolher daqui podes usar uma ação mais baixa, pagando 1 milho por cada passo atrás.';
 if(g==='pal'&&k>=2&&k<=5) t+=' A selva tem de ser limpa: primeiro recolhe-se a madeira (ou queima-se, descendo 1 templo), depois colhe-se o milho.';
 return t; }
function tipTemple(t,i){ const T=E.TEMPLES[t]; const top=T.vp.length-1;
 let s=`${E.GOD[t]}, ${i===0?'degrau mais baixo':i===1?'degrau inicial':i===top?'topo (só um jogador pode estar aqui)':'degrau '+i}: vale ${T.vp[i]} pontos nos dias 13 e 26.`;
 if(T.res[i]) s+=` Nos dias 7 e 20, quem estiver aqui ou acima recebe ${({stone:'1 pedra',gold:'1 ouro',wood:'1 madeira',skull:'1 caveira'})[T.res[i]]}.`;
 if(i===top) s+=' Chegar ao topo vira o tabuleiro do jogador para o lado claro.';
 return s; }
function tipTech(t,l){ return `${E.TECHN[t]} nível ${l+1}: ${E.TECHLV[t][l]}. ${tcellTip(t,l)}. Custa ${l+1} recurso(s) em Tikal; os níveis acumulam.`; }
function tipDay(d){ const f=E.FOOD[d]; if(f) return `Dia ${d}: dia de comida. Cada trabalhador come 2 milho (ou perdes 3 pontos por cada um). ${f==='mid'?'Os templos dão recursos.':'Os templos dão pontos e bónus'+(d===13?'; muda para a era 2.':'; fim do jogo.')}`;
 const left=[7,13,20,26].find(x=>x>=d)-d; return `Dia ${d}: faltam ${left} dia(s) para o próximo dia de comida.`; }

/* ---------- fluxo ---------- */
function startGame(){
 document.querySelectorAll('[data-seat]').forEach(inp=>{ setup.seats[+inp.dataset.seat].name=inp.value.trim(); });
 const players=setup.seats.slice(0,setup.n).map((st,i)=>({name:st.name||E.CNAMES[i],bot:st.bot}));
 S=E.newGame({players,seed:(Date.now()%2147483647)|0});
 UI.pending=[]; UI.snap=null; UI.rotCur={}; save(); flow();
}
function flow(){
 render();
 if(!S) return;
 if(S.over){ showEnd(); return; }
 if(S.phase==='wealth'){
  const pid=S.players.findIndex(p=>!p.wealthChosen);
  if(S.players[pid].bot){ E.botWealth(S,pid); save(); return flow(); }
  showWealth(pid); return;
 }
 if(S.turnIdx>=S.n){
  if(E.canTwoDays(S)){ const pid=S.startWorker; if(S.players[pid].bot) E.endRound(S,E.botTwo(S)); else { showTwo(pid); return; } }
  else E.endRound(S,false);
  save(); return flow();
 }
 const pid=E.curPid(S), p=S.players[pid];
 if(!S.turn||S.turn.pid!==pid) E.beginTurn(S);
 if(p.bot){ UI.busy=true; render(); setTimeout(()=>{ try{ E.botTurn(S); }catch(e){ console.error(e); } UI.busy=false; save(); flow(); },550); return; }
 const key=S.round+'-'+S.turnIdx;
 if(UI.snapKey!==key){ UI.snapKey=key; UI.snap=E.clone(S); UI.pending=[]; }
 if(E.pityNeeded(S,pid)){ E.doPity(S,pid); E.endTurn(S); save(); return flow(); }
 render();
}
const humanTurn=()=>S&&!S.over&&S.phase==='play'&&S.turnIdx<S.n&&!S.players[E.curPid(S)].bot&&!UI.busy&&!UI.choice&&!UI.modal;
function canPlaceNow(){ if(!humanTurn()) return false; const pid=E.curPid(S);
 if(S.turn.mode==='pick') return false; if(E.forcedBeg(S,pid)) return false;
 return E.availWorkers(S,pid)-UI.pending.length>0; }
function canPickNow(){ if(!humanTurn()) return false; const pid=E.curPid(S);
 return S.turn.mode!=='place' && UI.pending.length===0 && !E.forcedBeg(S,pid); }
function addCost(g){ const pid=curP(); const a=E.planPlacement(S,pid,UI.pending), b=E.planPlacement(S,pid,[...UI.pending,g]); return b.ok?b.cost-(a.ok?a.cost:0):null; }

const isCard=n=>n.bld!=null||n.mon!=null;
function openChoice(title,nodes,cancellable,onDone){ UI.sheet=null; UI.min=false; UI.choice={title,nodes,cancellable,onDone,snap:E.clone(S)};
 if(nodes.length===1&&!cancellable&&!nodes[0].loop&&!isCard(nodes[0])) return runChoice(0);
 renderModal(); }
function runChoice(i){ const c=UI.choice; const pid=E.curPid(S); const nd=c.nodes[i];
 E.logp(S,pid,nd.label); const ch=nd.run(S);
 let title=c.title;
 if(nd.bld!=null) title=`${E.BLD[nd.bld].n}: escolhe o benefício`;
 if(ch.some(n=>n.bld!=null)&&ch.some(n=>n.noArch)) title='Tikal 4: segundo edifício (opcional)';
 else if(ch.some(n=>n.bld!=null)&&nd.bld!=null) title=`${E.BLD[nd.bld].n}: podes construir outro edifício`;
 if(ch.length){ UI.choice={title,nodes:ch,cancellable:false,onDone:c.onDone,snap:c.snap}; render();
  if(ch.length===1&&!ch[0].loop&&!isCard(ch[0])) return runChoice(0); renderModal(); }
 else { UI.choice=null; renderModal(); render(); if(c.onDone) c.onDone(); } }

function monIf(p,mid){ if(!p) return 0; const s2=E.clone(S); const q=s2.players[p.id]; q.monuments.push(mid); s2.monBuilt++; return E.monScore(s2,q,mid); }
function choiceCard(n,i){
 if(n.bld!=null){ const B=E.BLD[n.bld];
  return `<button class="hc hcbtn" style="--c:${BCOL[B.t]}" data-act="choose" data-i="${i}"><div class="hct">${BSHORT[B.t]} · era ${B.a}</div><div class="hcn">${esc(B.n)}</div>
   <div class="hcl">Pagas</div><div class="hcc">${n.paid}</div><div class="hcl">Recebes</div><div class="hce">${rich(E.effText(B.e))}</div>${n.arch?`<div class="hca">${n.arch}</div>`:''}</button>`; }
 const M=E.MON[n.mon]; const p=S.players[curP()];
 return `<button class="hc hcbtn" style="--c:${BCOL[M.t]}" data-act="choose" data-i="${i}"><div class="hct">Monumento ${BSHORT[M.t].toLowerCase()}</div><div class="hcn">${esc(M.n)}</div>
  <div class="hcl">Pagas</div><div class="hcc">${n.paid}</div><div class="hcl">No fim do jogo</div><div class="hce">${rich(M.d)}</div><div class="hca">Se o jogo acabasse agora: ${monIf(p,n.mon)}★</div></button>`; }
function renderModal(){ const m=$('#modal');
 let html=''; const minable=!!(UI.choice||UI.modal);
 if(UI.choice){ const c=UI.choice;
  const cardIdx=c.nodes.map((n,i)=>i).filter(i=>c.nodes[i].bld!=null||c.nodes[i].mon!=null);
  const plain=c.nodes.map((n,i)=>i).filter(i=>!cardIdx.includes(i));
  let note=''; if(c.nodes.some(n=>n.noArch)) note='<p class="hint">Segundo edifício de Tikal 4: não recebe o bónus de arquitetura (só um dos dois edifícios o recebe).</p>';
  else if(c.nodes.some(n=>n.arch)) note='<p class="hint">O bónus de arquitetura aplica-se a este edifício.</p>';
  html=`<h3>${esc(c.title)}</h3><div class="pinfo">${pinfo()}</div>${note}${cardIdx.length?`<div class="hcards choosecards">${cardIdx.map(i=>choiceCard(c.nodes[i],i)).join('')}</div>`:''}${c.select?'<p class="hint">Já está escolhida a ação do espaço onde está o trabalhador (sem custo). Podes tocar noutra antes de confirmar.</p>':''}<div class="opts">${plain.map(i=>`<button class="opt ${c.select&&c.sel===i?'sel':''}" data-act="choose" data-i="${i}">${c.select&&c.sel===i?'✔ ':''}${rich(c.nodes[i].label)}${c.select&&c.nodes[i].here?' <span class="free">sem custo</span>':''}</button>`).join('')}</div>
   ${c.select?`<button class="primary" data-act="doSel" ${c.sel>=0?'':'disabled'}>${c.sel>=0?'Fazer esta ação':'Escolhe uma ação'}</button> `:''}
   <button class="ghost" data-act="cancelChoice">${c.cancellable?'Cancelar':'Voltar atrás (desfaz esta ação)'}</button>`; }
 else if(UI.modal) html=UI.modal;
 else if(UI.sheet&&S) html=sheetHTML(UI.sheet)+'<button class="primary" data-act="closeSheet">Fechar</button>'+(S.over?' <button data-act="showEnd">Voltar aos resultados</button>':'');
 const pill=$('#minpill');
 if(html&&minable&&UI.min){ m.classList.remove('show'); m.innerHTML=''; pill.hidden=false; return; }
 pill.hidden=true;
 if(html){ m.innerHTML=`<div class="box">${minable?'<button class="minbtn small" data-act="minModal" data-tip="Esconde esta janela para veres o tabuleiro. Volta com o botão em baixo.">▾ Ver tabuleiro</button>':''}${html}</div>`; m.classList.add('show'); } else { m.classList.remove('show'); m.innerHTML=''; } }
function pinfo(){ const pid=curP(); if(pid<0) return ''; const p=S.players[pid]; return `${tok(p)} ${esc(p.name)}: 🌽${p.corn} 🪵${p.wood} 🪨${p.stone} 🪙${p.gold} 💀${p.skull}`; }
function showModal(html){ UI.modal=html; UI.sheet=null; UI.min=false; renderModal(); }
function closeModal(){ UI.modal=null; renderModal(); }
function openSheet(sh){ if(UI.choice) return; if(UI.modal){ if(!(S&&S.over)) return; UI.modal=null; } UI.sheet=sh; renderModal(); }

function showWealth(pid){ const p=S.players[pid]; UI.wsel=[];
 const draw=()=>{ showModal(`<h3>${esc(p.name)}: escolhe 2 peças de riqueza inicial</h3>
  ${S.players.filter(q=>!q.bot).length>1?'<p class="hint">Os outros jogadores não devem espreitar.</p>':''}
  <div class="opts">${S.hands[pid].map(ti=>`<button class="opt ${UI.wsel.includes(ti)?'sel':''}" data-act="wtile" data-t="${ti}"><small class="wloc">${E.GI[E.TILES[ti].g].name} ${E.TILES[ti].a}</small> ${rich(E.effText(E.TILES[ti].e))}</button>`).join('')}</div>
  <button class="primary" data-act="wconfirm" ${UI.wsel.length===2?'':'disabled'}>Confirmar</button>`); };
 UI.wdraw=draw; UI.wpid=pid; draw(); }

 showModal(`<h3>Fim do jogo</h3><table class="res"><tr><th></th><th>Antes</th><th>Recursos+🌽</th><th>💀</th><th>Monum.</th><th>Total</th></tr>
 ${r.map((x,i)=>{ const p=S.players[x.id]; return `<tr class="${i===0?'win':''}"><td>${tok(p)} ${esc(p.name)}</td><td>${x.before}</td><td>${x.cornVP}</td><td>${x.skullVP}</td><td>${x.monVP}</td><td><b>${x.total}</b></td></tr>`; }).join('')}</table>
 ${r.some(x=>x.mons.length)?`<p class="hint">Monumentos: ${r.filter(x=>x.mons.length).map(x=>`${esc(S.players[x.id].name)}: ${x.mons.map(m=>`${esc(m.n)} ${m.vp}★`).join(', ')}`).join(' · ')}</p>`:''}
 <p class="hint">"Recursos+🌽": madeira, pedra e ouro viram milho (2, 3 e 4) e cada 4🌽 vale 1★. O detalhe completo de cada jogador está no Registo.</p>
 <p>Vence <b>${esc(S.players[r[0].id].name)}</b>!</p><button class="primary" data-act="newgame">Novo jogo</button> <button data-act="sheet" data-t="log">Ver registo</button> <button class="ghost" data-act="closeModal">Ver tabuleiro</button>`); }

/* ---------- fichas de detalhe ---------- */
function sheetHTML(sh){
 if(sh.t==='gear') return gearSheet(sh.g);
 if(sh.t==='temples') return templeSheet();
 if(sh.t==='tech') return techSheet();
 if(sh.t==='score') return scoreSheet();

function gearSheet(g){ const gi=E.GI[g]; const pid=curP();
 const ghost=[]; if(UI.pending.length){ const pl=E.planPlacement(S,pid,UI.pending); if(pl.ok) pl.spots.forEach(sp=>{ if(sp.gear===g) ghost.push(sp.pos); }); }
 let btn=''; if(canPlaceNow()){ const c=addCost(g); btn=c!=null?`<button class="primary" data-act="place" data-g="${g}" data-close="1">Colocar aqui (+${c}🌽)</button>`:'<span class="hint">Roda cheia.</span>'; }

 for(let i=0;i<G.teeth;i++){ const [sx,sy]=P(0,0,G.rg-17,G.a0+i*st); h+=`<circle cx="${sx}" cy="${sy}" r="11" fill="#d5c59e"/>`; }

function animateRot(){ const els=[...document.querySelectorAll('.rot')]; if(UI.anim) cancelAnimationFrame(UI.anim);
 const items=els.map(el=>({el,key:el.getAttribute('data-key'),to:+el.getAttribute('data-rot'),from:UI.rotCur[el.getAttribute('data-key')]}));
 items.forEach(it=>{ if(it.from==null){ it.from=it.to; UI.rotCur[it.key]=it.to; } });
 if(items.every(it=>it.from===it.to)) return;
 const t0=performance.now(), D=900;
 const step=now=>{ const k=Math.min(1,(now-t0)/D); const e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
  items.forEach(it=>{ const v=it.from+(it.to-it.from)*e; UI.rotCur[it.key]=v; it.el.setAttribute('transform',`rotate(${v.toFixed(2)})`); });
  if(k<1) UI.anim=requestAnimationFrame(step); else UI.anim=null; };

 const ox=r.left+(r.width-v.w*sc)/2, oy=r.top+(r.height-v.h*sc)/2; return {x:v.x+(cx-ox)/sc,y:v.y+(cy-oy)/sc,sc}; }
function zoomAt(f,cx,cy){ const v=UI.vb; const p=cx==null?{x:v.x+v.w/2,y:v.y+v.h/2}:toSvg(cx,cy); const nw=Math.min(VBW,Math.max(320,v.w*f)); const k=nw/v.w;
 v.x=p.x-(p.x-v.x)*k; v.y=p.y-(p.y-v.y)*k; v.w=nw; applyVB(); }
function bindBoard(){ const b=$('#board'); if(!b) return;
 b.addEventListener('wheel',e=>{ e.preventDefault(); zoomAt(e.deltaY>0?1.15:1/1.15,e.clientX,e.clientY); },{passive:false});
 b.addEventListener('pointerdown',e=>{ if(e.target.closest('.zoom')) return; UI.ptr[e.pointerId]={x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY}; UI.dragged=false; });
 b.addEventListener('pointermove',e=>{ const p=UI.ptr[e.pointerId]; if(!p) return; const ids=Object.keys(UI.ptr);
  if(ids.length===2){ const [a,c]=ids.map(i=>UI.ptr[i]); const d0=Math.hypot(a.x-c.x,a.y-c.y); p.x=e.clientX; p.y=e.clientY; const d1=Math.hypot(a.x-c.x,a.y-c.y);
   if(d0>0&&d1>0){ zoomAt(d0/d1,(a.x+c.x)/2,(a.y+c.y)/2); } UI.dragged=true; return; }
  const dx=e.clientX-p.x, dy=e.clientY-p.y; if(Math.hypot(e.clientX-p.sx,e.clientY-p.sy)>8) UI.dragged=true;
  if(UI.dragged&&UI.vb.w<VBW){ const sc=toSvg(e.clientX,e.clientY).sc; UI.vb.x-=dx/sc; UI.vb.y-=dy/sc; applyVB(); }
  p.x=e.clientX; p.y=e.clientY; });
 const up=e=>{ delete UI.ptr[e.pointerId]; };
 b.addEventListener('pointerup',up); b.addEventListener('pointercancel',up); b.addEventListener('pointerleave',up); }

/* ---------- eventos ---------- */
function attr(el,n){ return el.getAttribute('data-'+n); }
document.addEventListener('click',e=>{ const t=e.target.closest('[data-act]'); if(!t||t.disabled) return;
 if(UI.dragged&&t.closest('#svg')){ UI.dragged=false; return; }
 const act=attr(t,'act'); const pid=curP();
 const syncNames=()=>document.querySelectorAll('[data-seat]').forEach(inp=>setup.seats[+inp.dataset.seat].name=inp.value.trim());
 switch(act){
  case 'setn': syncNames(); setup.n=+attr(t,'n'); render(); break;
  case 'seat': syncNames(); setup.seats[+attr(t,'i')].bot=attr(t,'bot')==='1'; render(); break;
  case 'start': startGame(); break;
  case 'resume': S=loadSaved(); UI.pending=[]; UI.snapKey=null; UI.rotCur={}; flow(); break;
  case 'menu': showModal('<h3>Voltar ao menu?</h3><p>O jogo fica guardado no início deste turno e podes continuá-lo depois.</p><div class="opts"><button class="primary" data-act="menuYes">Voltar ao menu</button><button data-act="closeModal">Continuar a jogar</button></div>'); break;
  case 'menuYes': if(UI.snap&&!S.over) S=UI.snap; save(); S=null; UI.choice=null; UI.sheet=null; UI.modal=null; renderModal(); render(); break;
  case 'sheet': openSheet({t:attr(t,'t')}); break;
  case 'psheet': UI.sheet=null; openSheet({t:'player',p:+attr(t,'p')}); break;
  case 'gear': { const g=attr(t,'g'), k=attr(t,'k'); if(k!=null&&canPickNow()){ const w=S.workers.find(x=>x.owner===pid&&x.gear===g&&x.pos===+k); if(w){ openPick(w.id); break; } } openSheet({t:'gear',g}); break; }
  case 'temples': openSheet({t:'temples'}); break;
  case 'tech': openSheet({t:'tech'}); break;
  case 'score': openSheet({t:'score'}); break;
  case 'market': openSheet({t:'market'}); break;
  case 'bld': openSheet({t:'bld',id:+attr(t,'id')}); break;
  case 'mon': openSheet({t:'mon',id:+attr(t,'id')}); break;
  case 'startinfo': openSheet({t:'start'}); break;
  case 'closeSheet': UI.sheet=null; renderModal(); break;
  case 'closeModal': closeModal(); break;
  case 'showEnd': showEnd(); break;
  case 'newgame': clearSaved(); S=null; closeModal(); render(); break;
  case 'zin': zoomAt(1/1.35); break;
  case 'zout': zoomAt(1.35); break;
  case 'zreset': UI.vb={x:0,y:0,w:VBW,h:VBH}; applyVB(); break;
  case 'place': if(!canPlaceNow()) return; UI.pending.push(attr(t,'g')); if(!E.planPlacement(S,pid,UI.pending).ok) UI.pending.pop(); if(attr(t,'close')) UI.sheet=null; renderModal(); render(); break;
  case 'undo': UI.pending.pop(); render(); break;
  case 'confirm': if(E.commitPlacement(S,pid,UI.pending)){ UI.pending=[]; finishTurn(); } break;
  case 'endturn': finishTurn(); break;
  case 'restart': S=E.clone(UI.snap); UI.pending=[]; render(); break;
  case 'beg': openChoice('Mendigar milho',[E.begNode(pid)],true,()=>render()); break;
  case 'pick': if(!canPickNow()) return; openPick(+attr(t,'w')); break;
  case 'fullscreen': goFull(); break;
  case 'hideSide': UI.sideHidden=true; try{localStorage.setItem('cs_side','0');}catch(e){} render(); break;
  case 'showSide': UI.sideHidden=false; try{localStorage.setItem('cs_side','1');}catch(e){} render(); break;
  case 'minModal': UI.min=true; renderModal(); render(); break;
  case 'restoreModal': UI.min=false; renderModal(); render(); break;
  case 'choose': if(UI.choice&&UI.choice.select){ UI.choice.sel=+attr(t,'i'); renderModal(); break; } runChoice(+attr(t,'i')); break;
  case 'doSel': if(UI.choice&&UI.choice.sel>=0){ const i=UI.choice.sel; UI.choice.select=false; runChoice(i); } break;
  case 'cancelChoice': if(UI.choice&&UI.choice.snap) S=UI.choice.snap; UI.choice=null; renderModal(); render(); break;
  case 'wtile': { const ti=+attr(t,'t'); const i=UI.wsel.indexOf(ti); if(i>=0) UI.wsel.splice(i,1); else if(UI.wsel.length<2) UI.wsel.push(ti); UI.wdraw(); break; }
  case 'wconfirm': E.chooseWealth(S,UI.wpid,UI.wsel); closeModal(); save(); flow(); break;
  case 'two': closeModal(); E.endRound(S,attr(t,'v')==='2'); save(); flow(); break;
 }
});
$('#modal').addEventListener('click',e=>{ if(e.target.id==='modal'&&UI.sheet&&!UI.choice&&!UI.modal){ UI.sheet=null; renderModal(); } });

/* ---------- dicas (rato, botão direito, toque longo) ---------- */
const TIP={el:null,timer:null,long:false,sx:0,sy:0,shownAt:0};
function tipBox(){ if(!TIP.el){ TIP.el=document.createElement('div'); TIP.el.id='tip'; TIP.el.hidden=true; document.body.appendChild(TIP.el); } return TIP.el; }
function showTip(txt,x,y){ const b=tipBox(); b.textContent=txt; b.hidden=false; TIP.shownAt=Date.now();
 const W=window.innerWidth,H=window.innerHeight; const r=b.getBoundingClientRect();
 let lx=x+14, ly=y+16; if(lx+r.width>W-8) lx=Math.max(8,x-r.width-14); if(ly+r.height>H-8) ly=Math.max(8,y-r.height-14);
 b.style.left=lx+'px'; b.style.top=ly+'px'; }
function hideTip(){ clearTimeout(TIP.timer); if(TIP.el) TIP.el.hidden=true; }
const tipOf=t=>{ const el=t&&t.closest&&t.closest('[data-tip]'); const v=el&&el.getAttribute('data-tip'); return v||null; };
document.addEventListener('mouseover',e=>{ const v=tipOf(e.target); clearTimeout(TIP.timer); if(!v){ if(TIP.el&&!TIP.el.hidden&&Date.now()-TIP.shownAt>50) hideTip(); return; }
 TIP.timer=setTimeout(()=>showTip(v,e.clientX,e.clientY),350); });
document.addEventListener('mouseout',e=>{ if(!e.relatedTarget||!tipOf(e.relatedTarget)) hideTip(); });
document.addEventListener('contextmenu',e=>{ const v=tipOf(e.target); if(!v) return; e.preventDefault(); clearTimeout(TIP.timer); showTip(v,e.clientX,e.clientY); });
document.addEventListener('pointerdown',e=>{ if(e.pointerType==='mouse'){ if(!e.target.closest('#tip')) hideTip(); return; }
 if(TIP.el&&!TIP.el.hidden){ hideTip(); }
 const v=tipOf(e.target); TIP.long=false; TIP.sx=e.clientX; TIP.sy=e.clientY; clearTimeout(TIP.timer);
 if(v) TIP.timer=setTimeout(()=>{ TIP.long=true; showTip(v,TIP.sx,TIP.sy-40); },480); },true);
document.addEventListener('pointermove',e=>{ if(e.pointerType!=='mouse'&&Math.hypot(e.clientX-TIP.sx,e.clientY-TIP.sy)>10) clearTimeout(TIP.timer); },true);
document.addEventListener('pointerup',()=>{ clearTimeout(TIP.timer); },true);
document.addEventListener('click',e=>{ if(TIP.long){ TIP.long=false; e.preventDefault(); e.stopPropagation(); } },true);
window.addEventListener('scroll',hideTip,true);
function finishTurn(){ E.endTurn(S); UI.snap=null; UI.snapKey=null; UI.pending=[]; save(); flow(); }
try{ UI.sideHidden=localStorage.getItem('cs_side')==='0'; }catch(e){}
try{ if(screen.orientation&&screen.orientation.lock) screen.orientation.lock('landscape').catch(()=>{}); }catch(e){}
render();
})();

</script>
